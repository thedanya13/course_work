{% extends "base.html" %}
{% block title %}Мой профиль{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3>Редактирование профиля</h3>
                <p class="text-muted">Попробуйте ввести XSS-скрипт в поле "О себе"</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email:</label>
                        <input type="text" class="form-control" value="{{ current_user.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">О себе (Био):</label>
                        <textarea name="bio" class="form-control" rows="4">{{ profile.bio if profile else '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </form>

                <hr>
                <h5>Как это отображается на сайте:</h5>
                <div class="border p-3 bg-light">
                    {{ profile.bio if profile else 'Биография пуста' }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
